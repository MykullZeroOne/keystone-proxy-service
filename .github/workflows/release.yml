name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and package
        run: |
          chmod +x scripts/build-release.sh scripts/pkg/postinstall
          ./scripts/build-release.sh "${{ steps.version.outputs.VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/keystone-proxy-service-${{ steps.version.outputs.VERSION }}.pkg
            build/keystone-proxy-service-${{ steps.version.outputs.VERSION }}.dmg
            build/keystone-proxy-service
